name: retail-etl

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PG_DB:-retail_bi}
      POSTGRES_USER: ${PG_USER:-retail_etl}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-retail_demo}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${PG_PORT_EXTERNO:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-retail_etl} -d ${PG_DB:-retail_bi}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  panel:
    build:
      context: ..
      dockerfile: deploy/panel/Dockerfile
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PG_DB: ${PG_DB:-retail_bi}
      PG_USER: ${PG_USER:-retail_etl}
      PG_PASSWORD: ${PG_PASSWORD:-retail_demo}
      WEB_URL: ${WEB_URL:-http://localhost:8080}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
      SPARK_LOCAL_IP: 127.0.0.1
    ports:
      - "${PANEL_PORT:-8000}:8000"
    volumes:
      # data/raw y data/staging viven en el host: sobreviven a los rebuilds.
      - ../data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/salud')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - panel
    restart: unless-stopped

volumes:
  pgdata:
